# Interactive local development with browser-based OAuth.
# Set DBT_SOURCE_DATABASE and DBT_SOURCE_SCHEMA separately for source tables.
stock_analytics:
  target: databricks_dev
  outputs:
    databricks_dev:
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH') }}"
      auth_type: oauth
      catalog: "{{ env_var('DATABRICKS_CATALOG') }}"
      schema: "{{ env_var('DATABRICKS_DBT_SCHEMA') }}"
      threads: 1
      session_properties:
        TIMEZONE: "UTC"
